name: Hackathon branch validation

on:
  push:
    branches:
      - classifier/adaptive-calibrated-local
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Format submission Rust files
        run: |
          rustfmt --edition 2024 \
            llm-router/src/routing/request_classifier.rs \
            llm-router/src/routing/mod.rs \
            llm-router/src/handlers/chat.rs
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- llm-router/src/routing/request_classifier.rs llm-router/src/routing/mod.rs llm-router/src/handlers/chat.rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add llm-router/src/routing/request_classifier.rs llm-router/src/routing/mod.rs llm-router/src/handlers/chat.rs
            git commit -m "style: rustfmt classifier hardening"
            git push
          fi
      - name: Regenerate classifier artifact
        run: python llm-router/scripts/classifier_train.py
      - name: Commit regenerated classifier artifacts if needed
        run: |
          if ! git diff --quiet -- llm-router/assets/classifier/linear-v1.json llm-router/data/classifier/train.jsonl llm-router/data/classifier/validation.jsonl; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add llm-router/assets/classifier/linear-v1.json llm-router/data/classifier/train.jsonl llm-router/data/classifier/validation.jsonl
            git commit -m "classifier: regenerate expanded deterministic model"
            git push
          fi
      - name: Check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p nasiko-llm-router
      - name: Classifier smoke
        run: |
          curl -fsSL https://registry.nasiko.dev/r/nasiko/classifier-eval -o /tmp/classifier-eval.json
          CLASSIFIER_BACKEND=regex EVAL_SET=/tmp/classifier-eval.json OUT=/tmp/regex.jsonl cargo run --release -p nasiko-llm-router --example classifier_eval
          CLASSIFIER_BACKEND=local EVAL_SET=/tmp/classifier-eval.json OUT=/tmp/local.jsonl cargo run --release -p nasiko-llm-router --example classifier_eval
          echo "regex:"
          cat /tmp/regex.jsonl
          echo "local:"
          cat /tmp/local.jsonl
